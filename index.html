<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Sons de kauan </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/eu.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>
    <h1 class="titulo"> Sons de Terror </h1>

    <section class="teclado">
        <button class="tecla tecla_pom"><img src="images/aplausos.svg" alt="Grito Assustador"></button>
        <button class="tecla tecla_clap"><img src="images/galo.png" alt="Uivo de Lobo"></button>
        <button class="tecla tecla_tim"><img src="images/amigos.png" alt="Sussurro Fantasma"></button>
        <button class="tecla tecla_puff"><img src="images/vitoria.svg" alt="Risada Maluca"></button>
        <button class="tecla tecla_splash"><img src="images/errado.svg" alt="Porta Batendo"></button>
        <button class="tecla tecla_toim"><img src="images/sinal.png" alt="Passos no Escuro"></button>
        <button class="tecla tecla_psh"><img src="images/choro.png" alt="Choro Espectral"></button>
        <button class="tecla tecla_tic"><img src="images/grilo.svg" alt="Relógio Assombrado"></button>
        <button class="tecla tecla_t"><img src="images/tambores.svg" alt="Trovão Sombrio"></button>
        <button class="tecla tecla_i"><img src="images/senta.png" alt="Arranhão na Parede"></button>
        <button class="tecla tecla_c"><img src="images/certo.png" alt="Voz Distante"></button>
        <button class="tecla tecla_tom"><img src="images/stop.png" alt="Grito Final"></button>
    </section>

    <audio src="sounds/grito_assustador.mp3" id="som_tecla_pom"></audio>
    <audio src="sounds/uivo_lobo.mp3" id="som_tecla_clap"></audio>
    <audio src="sounds/sussurro_fantasma.mp3" id="som_tecla_tim"></audio>
    <audio src="sounds/risada_maluca.mp3" id="som_tecla_puff"></audio>
    <audio src="sounds/porta_batendo.mp3" id="som_tecla_splash"></audio>
    <audio src="sounds/passos_escuro.mp3" id="som_tecla_toim"></audio>
    <audio src="sounds/choro_espectral.mp3" id="som_tecla_psh"></audio>
    <audio src="sounds/relogio_assombrado.mp3" id="som_tecla_tic"></audio>
    <audio src="sounds/trovão_sombrio.wav" id="som_tecla_t"></audio>
    <audio src="sounds/arranhão_parede.mp3" id="som_tecla_i"></audio>
    <audio src="sounds/voz_distante.mp3" id="som_tecla_c"></audio>
    <audio src="sounds/grito_final.mp3" id="som_tecla_tom"></audio>

    <footer class="rodape">
        <img src="images/bem_vindo.gif" class="tiago">
        <p class="by"> Última Atualização: 23/08/2025 </p>
    </footer>

<script src="main.js"> </script>

</body>

</html>
